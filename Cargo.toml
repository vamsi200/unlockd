[package]
name = "unlockd"
version = "0.1.0"
edition = "2024"

[dependencies]
nanoid = "0.5.0"
pam = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.3"

[lib]
crate-type = ["cdylib"]
